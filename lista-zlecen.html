<script>
(function () {
  var d = document.documentElement, theme = 'light', lang = 'pl';
  d.classList.add('js', 'js-guard');
  try {
    theme = localStorage.getItem('anws-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    lang = localStorage.getItem('anws-lang') || 'pl';
  } catch (e) {}
  d.dataset.theme = theme;
  d.lang = lang;
})();
</script>
